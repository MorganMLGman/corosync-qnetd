# SPDX-License-Identifier: AGPL-3.0-only
name: image

on:
  push:
    branches: [master]
    tags: ['v*']
    # Only what ends up in the image. GitHub does not apply path filters to tag pushes.
    paths: [Dockerfile, entrypoint.sh, .github/workflows/image.yml]
  pull_request:
    paths: [Dockerfile, entrypoint.sh, .github/workflows/image.yml]
  workflow_dispatch:
  schedule:
    # Weekly rebuild picks up Debian security updates in the base image.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          # A pull request only proves the image still builds on every platform.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
